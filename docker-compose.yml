services:
  web:
    image: tomcat:latest
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      #DA SETTARE FILE WAR CORRETTO
      - ./target/OURWEBAPP.war:/usr/local/tomcat/webapps/OURWEBAPP.war
      - ./tmp/server.xml:/usr/local/tomcat/conf/server.xml
      - ./logs:/usr/local/tomcat/webapps/my-logs
      - ./tmp/context.xml:/usr/local/tomcat/webapps.dist/manager/META-INF/context.xml
      - ./tmp/tomcat-users.xml:/usr/local/tomcat/conf/tomcat-users.xml

  db:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=93ak!HBtb?
    volumes:
      - ./data/db:/var/lib/postgresql/data/
      #- ./src/main/database/schema.sql:/docker-entrypoint-initdb.d/01-init.sql
      #- ./src/main/database/sigirwebapp-insert.sql:/docker-entrypoint-initdb.d/02-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 50