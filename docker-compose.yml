services:
  web:
    build: .
    ports:
      - 8080:8080
    environment:
      - TZ=Europe/Rome
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Webapp
      # TODO: dev only - revert to WAR mount for production:
      #   - ./target/taptable.war:/usr/local/tomcat/webapps/taptable.war
      - ./target/taptable:/usr/local/tomcat/webapps/taptable
      - ./src/main/webapp/css:/usr/local/tomcat/webapps/taptable/css
      - ./src/main/webapp/jsp:/usr/local/tomcat/webapps/taptable/jsp
      - ./src/main/webapp/js:/usr/local/tomcat/webapps/taptable/js
      # Logs
      - ./logs:/usr/local/tomcat/webapps/logs/taptable
      # Tomcat config files
      - ./conf/server.xml:/usr/local/tomcat/conf/server.xml
      - ./conf/tomcat-users.xml:/usr/local/tomcat/conf/tomcat-users.xml
      - ./conf/context.xml:/usr/local/tomcat/webapps/manager/META-INF/context.xml

  db:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: taptable
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/CREATE.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db/DUMP.sql:/docker-entrypoint-initdb.d/02-dump.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d taptable"]
      interval: 5s
      timeout: 10s
      retries: 5

  # TODO: dev only - remove for production
  browsersync:
    image: node:20-alpine
    command: npx --yes browser-sync start --proxy "web:8080" --port 3000 --files "/watch/**/*" --no-open
    ports:
      - 3000:3000
    volumes:
      - ./src/main/webapp/css:/watch/css
      - ./src/main/webapp/jsp:/watch/jsp
      - ./src/main/webapp/js:/watch/js
      - npm_cache:/root/.npm
    depends_on:
      - web

  pgadmin:
    image: elestio/pgadmin
    ports:
      - "5050:80"
    environment:
      # Required by pgAdmin
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: admin

      # Don't require the user to login
      PGADMIN_CONFIG_SERVER_MODE: "False"

      # Don't require a "master" password after logging in
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin:/pgadmin4/servers.json

volumes:
  postgres_data:
  pgadmin:
  npm_cache:

secrets:
  postgres_password:
    file: secrets/postgres_password.txt
